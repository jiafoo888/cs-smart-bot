# Render Blueprint — keep service name aligned with live URL cs-smart-bot.onrender.com
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: cs-smart-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      # Free demo defaults to mock. For company trial: set OPENAI_API_KEY in
      # Render Dashboard and flip USE_MOCK_LLM=false (see DEPLOY.md §C).
      - key: USE_MOCK_LLM
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDING_BACKEND
        value: hash
      - key: VECTOR_STORE
        value: simple
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/cs_bot.db
      - key: COMPANY_NAME
        value: SteelHub Logistics
